name = "freellmapi-cf"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "de9cc5da9705c7edf34e7e4e0ac9e360"

# ---------------- D1 数据库 ----------------
[[d1_databases]]
binding = "DB"
database_name = "freellmapi"
database_id = "7d80b8e3-e42e-4c55-9fca-cd1e1de63340"

# ---------------- KV 命名空间 ----------------
[[kv_namespaces]]
binding = "CONFIG"
id = "377c399a65984ba1aca35b0b607c12b3"

# ---------------- Durable Objects ----------------
[[durable_objects.bindings]]
name = "KEY_STATE"
class_name = "KeyState"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KeyState", "Session"]

# ---------------- Cron Triggers ----------------
[triggers]
crons = ["0 */12 * * *"]  # 每 12 小时同步一次模型目录

# ---------------- 环境变量 ----------------
[vars]
ENVIRONMENT = "production"
SESSION_TTL_MINUTES = "30"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX_REQUESTS = "60"
APP_VERSION = "3.6.0"
BACKEND_URL = "https://api.zjkl0330.dpdns.org"
DASHBOARD_URL = "https://admin.zjkl0330.dpdns.org"

# ---------------- Secrets（敏感） ----------------
# ENCRYPTION_KEY, JWT_SECRET, ADMIN_BOOTSTRAP_CODE 在 GitHub Actions 里设置
